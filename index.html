<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D63A2F">
<meta name="description" content="منوی دیجیتال کافه رترو">
<meta property="og:title" content="کافه رترو | منو">
<meta property="og:type" content="website">

<title>کافه رترو | منو</title>
<style>
  @font-face{font-family:'Vazirmatn';src:url('fonts/Vazirmatn-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
  @font-face{font-family:'Vazirmatn';src:url('fonts/Vazirmatn-Medium.woff2') format('woff2');font-weight:500;font-display:swap}
  @font-face{font-family:'Vazirmatn';src:url('fonts/Vazirmatn-Bold.woff2') format('woff2');font-weight:700;font-display:swap}
  @font-face{font-family:'Vazirmatn';src:url('fonts/Vazirmatn-Bold.woff2') format('woff2');font-weight:800;font-display:swap}

  :root{
    /* سیستم رنگ «رترو»: ۶۰/۳۰/۱۰ — کرم / قرمز / زرد */
    --bg:#FFF9F0;
    --surface:#FFFFFF;
    --ink:#231A12;
    --ink-soft:#5C4B3A;
    --muted:#A68E76;
    --accent:#D63A2F;
    --accent-deep:#B3281F;
    --accent-soft:#FDE9E4;
    --gold:#FFB627;
    --gold-soft:#FFF3D9;
    --line:#F0E4D2;
    --shadow:0 10px 28px rgba(120,70,40,.10);
    --shadow-sm:0 4px 14px rgba(120,70,40,.08);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html{scroll-behavior:smooth}
  body{
    font-family:'Vazirmatn','Segoe UI',Tahoma,sans-serif;
    background:var(--bg);color:var(--ink);
    min-height:100vh;
    padding-bottom:calc(30px + env(safe-area-inset-bottom));
    overflow-x:hidden;
  }

  /* ── اسپلش ── */
  .view-full{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#E04A2F,#B3281F);color:#fff;text-align:center;padding:24px;cursor:pointer}
  .splash-logo{width:126px;height:126px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:3.4rem;
    background:var(--gold);border:6px solid rgba(255,255,255,.92);
    box-shadow:0 18px 44px rgba(0,0,0,.28);margin-bottom:24px;
    animation:pop .5s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .view-full h1{font-size:2.3rem;font-weight:800}
  .latin-splash{font-family:Georgia,'Times New Roman',serif;font-size:.85rem;letter-spacing:.42em;text-indent:.42em;opacity:.92;margin-top:10px}

  /* ── خوش‌آمد: حباب‌های شناور ── */
  .welcome-art{position:relative;height:330px;flex-shrink:0}
  .bubble{position:absolute;border-radius:50%;overflow:hidden;background:#fff;
    border:5px solid #fff;box-shadow:var(--shadow);animation:float 5.5s ease-in-out infinite}
  .bubble img{width:100%;height:100%;object-fit:cover;display:block}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
  .b1{width:118px;height:118px;top:4px;right:6%}
  .b2{width:86px;height:86px;top:62px;left:8%;animation-delay:-1.6s}
  .b3{width:102px;height:102px;top:140px;right:20%;animation-delay:-3s}
  .b4{width:68px;height:68px;top:194px;left:22%;animation-delay:-2.2s}
  .b5{width:90px;height:90px;top:236px;right:8%;animation-delay:-4s}
  .b6{width:62px;height:62px;top:24px;left:37%;animation-delay:-.9s}
  .welcome-txt{text-align:center;padding:4px 24px 0}
  .welcome-txt h2{font-size:1.55rem;font-weight:800}
  .welcome-txt h2 .hl{color:var(--accent-deep)}
  .welcome-txt p{color:var(--muted);font-size:.92rem;margin-top:10px}
  .welcome-txt .hours{
    display:inline-flex;align-items:center;gap:7px;margin-top:16px;
    padding:8px 18px;border-radius:999px;font-size:.8rem;color:var(--ink-soft);
    background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm);
  }

  /* ── خوش‌آمد: دکمه‌ی چسبان پایین صفحه ── */
  #view-home{min-height:100dvh;display:flex;flex-direction:column}
  .bottom-cta{
    margin-top:auto;position:sticky;bottom:0;z-index:40;
    padding:20px 24px calc(22px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,rgba(255,249,240,0),var(--bg) 55%);
  }
  .cta{
    display:block;max-width:340px;margin:0 auto;text-decoration:none;text-align:center;
    background:linear-gradient(135deg,#E04A2F,#C0301F);color:#fff;
    font-weight:700;font-size:1.05rem;padding:16px 20px;border-radius:999px;
    box-shadow:0 10px 26px rgba(214,58,47,.42);
  }
  .cta:active{transform:scale(.98)}

  /* ── توپ‌بار ── */
  .topbar{
    position:sticky;top:0;z-index:50;
    background:rgba(255,249,240,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .topbar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 14px}
  .back{
    width:38px;height:38px;flex-shrink:0;border-radius:12px;text-decoration:none;
    display:flex;align-items:center;justify-content:center;font-size:1.2rem;color:var(--ink);
    background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm);
  }
  .topbar-title{flex:1;font-weight:800;font-size:1rem;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .count{color:var(--muted);font-size:.75rem;white-space:nowrap}
  .search{position:relative;margin:14px 0 2px}
  .search input{
    width:100%;padding:12px 44px 12px 16px;border-radius:14px;
    background:var(--surface);border:1px solid var(--line);
    color:var(--ink);font:inherit;font-size:.9rem;outline:none;box-shadow:var(--shadow-sm);
  }
  .search input::placeholder{color:#B9A88F}
  .search input:focus{border-color:var(--accent)}
  .search .ic{position:absolute;right:15px;top:50%;transform:translateY(-50%);font-size:.95rem;pointer-events:none;opacity:.65}

  /* ── لیست دسته‌ها ── */
  .catlist{margin:16px 0 6px}
  .catrow{
    display:flex;align-items:center;gap:14px;
    background:var(--surface);border:1px solid rgba(36,26,16,.05);border-radius:18px;
    padding:12px 14px;margin-bottom:10px;text-decoration:none;color:var(--ink);
    box-shadow:var(--shadow-sm);
  }
  .catrow:active{transform:scale(.99)}
  .catrow .th{
    width:62px;height:62px;border-radius:15px;flex-shrink:0;overflow:hidden;position:relative;
    background:var(--gold-soft);display:flex;align-items:center;justify-content:center;font-size:1.7rem;
  }
  .catrow .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .catrow .nm{font-weight:700;font-size:1rem}
  .catrow .ct{color:var(--muted);font-size:.75rem;margin-top:3px}
  .catrow .go{
    margin-inline-start:auto;flex-shrink:0;width:32px;height:32px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:var(--gold);color:#231A12;font-size:1.05rem;font-weight:700;
  }

  /* ── بدنه ── */
  .view{max-width:560px;margin:0 auto;padding:4px 16px}
  @keyframes inFwd{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
  @keyframes inBack{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
  .view.enter-fwd{animation:inFwd .26s cubic-bezier(.22,.8,.3,1)}
  .view.enter-back{animation:inBack .26s cubic-bezier(.22,.8,.3,1)}
  main{max-width:560px;margin:0 auto;padding:4px 0}
  #items{margin-top:10px}
  section{margin-top:26px}
  .sec-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .sec-head .ico{font-size:1.2rem}
  .sec-head h2{font-size:1.1rem;font-weight:800;white-space:nowrap}
  .sec-head .rule{flex:1;height:1px;background:var(--line)}

  .card{
    display:flex;align-items:center;gap:14px;
    background:var(--surface);border:1px solid rgba(36,26,16,.05);border-radius:20px;
    padding:14px;margin-bottom:12px;box-shadow:var(--shadow-sm);
  }
  .card .info{flex:1;min-width:0}
  .card .nm{font-size:.98rem;font-weight:700;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .card .ds{
    color:var(--muted);font-size:.78rem;margin-top:5px;line-height:1.9;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .card .pr{margin-top:8px;font-size:.98rem;font-weight:800;color:var(--accent-deep)}
  .card .pr small{font-weight:500;color:var(--muted);font-size:.72rem}
  .ph{
    width:92px;height:92px;border-radius:16px;flex-shrink:0;overflow:hidden;position:relative;
    background:var(--gold-soft);
    display:flex;align-items:center;justify-content:center;font-size:2rem;
  }
  .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .card.out .ph img{filter:grayscale(.7)}

  .bd{font-size:.67rem;padding:3px 10px;border-radius:999px;border:1px solid;font-weight:700}
  .bd.special{color:#9A5A1E;border-color:#EBD3AC;background:#F9EFD9}
  .bd.new{color:#2F7A3D;border-color:#BFE0C4;background:#E9F4EA}
  .bd.soldout{color:#B04444;border-color:#EFC9C9;background:#FAEDED}
  .card.out{opacity:.55}
  .card.out .pr{text-decoration:line-through;text-decoration-color:rgba(176,68,68,.55)}

  /* ── جستجو ── */
  #results{margin-top:22px}
  .res-title{color:var(--muted);font-size:.85rem;margin-bottom:14px;text-align:center}
  .res-title b{color:var(--accent-deep)}
  .empty{text-align:center;color:var(--muted);padding:46px 0;font-size:.9rem}
  .empty .big{font-size:2.2rem;display:block;margin-bottom:10px}
  body.searching #catlist-menu{display:none}

  /* ── فوتر ── */
  footer{max-width:560px;margin:48px auto 0;padding:0 20px;text-align:center}
  footer .rule{height:1px;background:var(--line);margin-bottom:24px}
  .tel{
    display:inline-flex;align-items:center;gap:9px;text-decoration:none;
    background:linear-gradient(135deg,#E04A2F,#C0301F);color:#fff;
    font-weight:700;font-size:.95rem;padding:13px 32px;border-radius:999px;
    box-shadow:0 8px 22px rgba(214,58,47,.38);
  }
  .frow{color:var(--muted);font-size:.85rem;line-height:2.3;margin-top:12px}
  .frow a{color:var(--accent-deep);text-decoration:none;font-weight:700}
  .credit{margin-top:24px;font-size:.75rem;color:#B9A88F}
</style>
</head>

/* ═══════════════ پایان داده‌ها — از این‌جا به بعد دست نزن ═══════════════ */

const $ = s => document.querySelector(s);
const fa = n => Number(n).toLocaleString('fa-IR');
const faDigits = s => String(s).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const norm = s => String(s).replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/\u200c/g,' ').toLowerCase();
const BADGE = {
  special:  { txt: 'پیشنهاد ویژه', cls: 'special' },
  new:      { txt: 'جدید',         cls: 'new' },
  soldout:  { txt: 'ناتمام',       cls: 'soldout' },
};
const priceTxt = p => fa(p) + ' <small>هزار تومان</small>';

/* هدر */
document.title = CAFE.name + ' | منو';
if (CAFE.hours) { $('#hero-hours').textContent = CAFE.hours; } else { $('#hero-hours-pill').remove(); }

/* فوتر — هر فیلدی خالی باشه نمایش داده نمی‌شه */
if (CAFE.phone) {
  $('#f-tel').hidden = false;
  const dial = String(CAFE.phone).replace(/^\+/, '');
  const intl = dial.startsWith('0') ? '+98' + dial.slice(1) : '+' + dial;
  $('#f-tel').href = 'tel:' + intl;
  $('#f-tel').innerHTML = '📞 تماس با کافه';
}
if (CAFE.address) { $('#f-address').hidden = false; $('#f-address').textContent = '📍 ' + CAFE.address; }
if (CAFE.instagram) {
  $('#f-ig').hidden = false;
  $('#f-ig').innerHTML = 'اینستاگرام: <a href="https://instagram.com/' + encodeURIComponent(CAFE.instagram) + '" dir="ltr">@' + CAFE.instagram + '</a>';
}
if (CAFE.hours) { $('#f-hours').hidden = false; $('#f-hours').textContent = CAFE.hours; }

/* کارت یک آیتم — withCat برچسب دسته را در نتایج جستجو نشان می‌دهد */
function itemCard(cat, it, withCat) {
  const b = BADGE[it.badge];
  const card = document.createElement('article');
  card.className = 'card' + (it.badge === 'soldout' ? ' out' : '');
  card.innerHTML =
    '<div class="ph">' + cat.icon +
      (it.imageUrl ? '<img src="' + it.imageUrl + '" alt="' + it.name + '" loading="lazy" onerror="this.remove()">' : '') +
    '</div>' +
    '<div class="info">' +
      '<div class="nm">' + it.name +
        (b ? ' <span class="bd ' + b.cls + '">' + b.txt + '</span>' : '') +
        (withCat ? ' <span style="color:var(--muted);font-size:.72rem;font-weight:400">' + cat.icon + ' ' + cat.name + '</span>' : '') +
      '</div>' +
      (it.description ? '<div class="ds">' + it.description + '</div>' : '') +
      '<div class="pr">' + priceTxt(it.price) + '</div>' +
    '</div>';
  return card;
}

/* ردیف یک دسته */
function catRow(cat) {
  const a = document.createElement('a');
  a.className = 'catrow';
  a.href = '#/cat/' + cat.id;
  a.innerHTML =
    '<div class="th">' + cat.icon +
      (cat.items[0] && cat.items[0].imageUrl
        ? '<img src="' + cat.items[0].imageUrl + '" alt="' + cat.name + '" loading="lazy" onerror="this.remove()">'
        : '') +
    '</div>' +
    '<div><div class="nm">' + cat.name + '</div>' +
    '<div class="ct">' + fa(cat.items.length) + ' آیتم</div></div>' +
    '<span class="go">‹</span>';
  return a;
}

/* ساخت لیست دسته‌ها */
$('#menu-name').textContent = CAFE.name;
function buildCatList(el) {
  el.innerHTML = '';
  CATEGORIES.forEach(cat => el.appendChild(catRow(cat)));
}
buildCatList($('#catlist-menu'));

/* رندر آیتم‌های یک دسته */
const itemsEl = $('#items');
function renderItems(id) {
  const cat = CATEGORIES.find(c => c.id === id) || CATEGORIES[0];
  $('#items-ico').textContent = cat.icon;
  $('#items-name').textContent = cat.name;
  $('#items-count').textContent = fa(cat.items.length) + ' آیتم';
  document.title = cat.name + ' | ' + CAFE.name;
  itemsEl.innerHTML = '';
  cat.items.forEach(it => itemsEl.appendChild(itemCard(cat, it, false)));
}

/* روتر: اسپلش ← خوش‌آمد ← دسته‌ها ← آیتم‌ها (دکمه برگشت گوشی هم کار می‌کند)
   ترنزیشن جهت‌دار: جلو رفتن از چپ، برگشتن از راست */
const views = { splash: $('#view-splash'), home: $('#view-home'), menu: $('#view-menu'), items: $('#view-items') };
const DEPTH = { splash: 0, home: 1, menu: 2, items: 3 };
let currentView = 'splash';
function show(name, dir) {
  Object.keys(views).forEach(k => {
    const v = views[k];
    v.hidden = (k !== name);
    v.classList.remove('enter-fwd', 'enter-back');
  });
  if (dir > 0) views[name].classList.add('enter-fwd');
  else if (dir < 0) views[name].classList.add('enter-back');
  scrollTo(0, 0);
  currentView = name;
}
function route() {
  const h = location.hash || '#/';
  q.value = '';
  resEl.innerHTML = '';
  resEl.hidden = true;
  document.body.classList.remove('searching');
  let target = 'splash';
  if (h.indexOf('#/cat/') === 0) {
    renderItems(h.slice(6));
    target = 'items';
  } else if (h === '#/menu') {
    document.title = 'منو | ' + CAFE.name;
    target = 'menu';
  } else if (h === '#/welcome') {
    document.title = CAFE.name + ' | خوش آمدید';
    target = 'home';
    try { sessionStorage.setItem('retro_seen', '1'); } catch (e) {}
  } else {
    document.title = CAFE.name;
    try { if (sessionStorage.getItem('retro_seen')) target = 'home'; } catch (e) {}
  }
  show(target, DEPTH[target] - DEPTH[currentView]);
  if (target === 'splash') {
    setTimeout(() => {
      if ((location.hash || '#/') === '#/' && currentView === 'splash')
        location.hash = '#/welcome';
    }, 2800);
  }
}
/* لمس اسپلش هم رد می‌شود */
$('#view-splash').addEventListener('click', () => { location.hash = '#/welcome'; });
addEventListener('hashchange', route);

/* جستجو */
const q = $('#q'), resEl = $('#results');
q.addEventListener('input', () => {
  const query = norm(q.value).trim();
  resEl.innerHTML = '';
  if (!query) {
    document.body.classList.remove('searching');
    resEl.hidden = true;
    return;
  }
  document.body.classList.add('searching');
  resEl.hidden = false;
  const hits = [];
  CATEGORIES.forEach(cat => cat.items.forEach(it => {
    if (norm(it.name + ' ' + (it.description || '')).includes(query))
      hits.push({ cat, it });
  }));
  const title = document.createElement('p');
  title.className = 'res-title';
  title.innerHTML = hits.length
    ? faDigits(hits.length) + ' مورد برای «<b>' + q.value.trim() + '</b>» پیدا شد'
    : '';
  resEl.appendChild(title);
  if (!hits.length) {
    resEl.innerHTML = '<div class="empty"><span class="big">🔍</span>چیزی با این اسم توی منو پیدا نشد</div>';
    return;
  }
  hits.forEach(({ cat, it }) => resEl.appendChild(itemCard(cat, it, true)));
});

/* شروع از مسیر فعلی */
route();

/* PWA — کش آفلاین بعد از اولین بازدید */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
