  }

  [hidden]{display:none!important}
  html{scroll-behavior:smooth}
  body{
    font-family:'Vazirmatn','Segoe UI',Tahoma,sans-serif;
    color:var(--text);
    min-height:100vh;
    padding-bottom:calc(28px + env(safe-area-inset-bottom));
    overflow-x:hidden;
  }

  .bg{position:fixed;inset:0;z-index:-3;background:linear-gradient(175deg,#41291a 0%,#2b1a10 45%,#170e08 100%)}
  .bg-photo{position:fixed;inset:0;z-index:-2;background:url('images/background.jpg') center/cover no-repeat;opacity:.9}
  .bg-photo::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(23,14,8,.62) 0%,rgba(23,14,8,.55) 30%,rgba(23,14,8,.88) 100%)}

  .hero{text-align:center;padding:44px 20px 20px}
  .hero .mark{
    width:76px;height:76px;margin:0 auto 14px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:2.1rem;
    background:rgba(255,255,255,.07);border:1px solid rgba(233,177,104,.4);
    box-shadow:0 8px 30px rgba(0,0,0,.35);
  }
  .hero h1{font-size:2rem;font-weight:700;letter-spacing:.3px;text-shadow:0 2px 18px rgba(0,0,0,.5)}
  .hero .tagline{color:var(--muted);font-size:.95rem;margin-top:6px}
  .hero .hours{
    display:inline-flex;align-items:center;gap:7px;margin-top:14px;
    padding:7px 16px;border-radius:999px;font-size:.82rem;color:var(--text);
    background:rgba(255,255,255,.07);border:1px solid var(--line);backdrop-filter:blur(8px);
  }

  .bar{
    position:sticky;top:0;z-index:50;
    background:rgba(20,13,9,.78);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid var(--line);
    padding:10px 14px 4px;
  }
  .mini{
    display:flex;align-items:center;justify-content:center;gap:8px;
    font-size:.92rem;font-weight:700;color:var(--accent);
    max-height:0;opacity:0;overflow:hidden;transition:max-height .25s ease,opacity .25s ease,margin .25s ease;
  }
  .bar.scrolled .mini{max-height:34px;opacity:1;margin-bottom:2px}
  .mini::before,.mini::after{content:'';height:1px;flex:1;max-width:60px;background:linear-gradient(90deg,transparent,rgba(233,177,104,.5))}
  .mini::after{background:linear-gradient(90deg,rgba(233,177,104,.5),transparent)}

  .search input{
    width:100%;padding:10px 40px 10px 14px;border-radius:13px;
    background:rgba(255,255,255,.07);border:1px solid var(--line);
    color:var(--text);font:inherit;font-size:.9rem;outline:none;
  }
  .search input::placeholder{color:rgba(199,173,142,.75)}
  .search input:focus{border-color:rgba(233,177,104,.55)}
  .search .ic{position:absolute;right:13px;top:50%;transform:translateY(-50%);font-size:.95rem;pointer-events:none;opacity:.8}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}

  .chip{
    white-space:nowrap;padding:8px 15px;border-radius:999px;font-size:.85rem;font-weight:500;
    color:var(--muted);background:rgba(255,255,255,.06);border:1px solid var(--line);
    cursor:pointer;transition:all .2s;flex-shrink:0;
  }
  .chip.on{background:linear-gradient(135deg,#f0c078,#d9973f);color:var(--accent-dark);font-weight:700;border-color:transparent}

  .card .pr{color:var(--accent);font-weight:700;font-size:.95rem;margin-top:7px}

    width:92px;height:92px;border-radius:16px;flex-shrink:0;overflow:hidden;position:relative;

  .gallery figure:active img{transform:scale(1.06)}

  .frow{color:var(--muted);font-size:.85rem;line-height:2.2;margin-top:13px}
  .frow a{color:var(--accent);text-decoration:none}
  .credit{margin-top:22px;font-size:.75rem;color:rgba(199,173,142,.55)}

      { name: "پنیری مرغ پستو", description: "ساندویچ مرغ با سس پستو و پنیر آب‌شده", price: 580, badge: "", imageUrl: "https://commons.wikimedia.org/wiki/Special:FilePath/File:Barbecue%20chicken%20sandwich-01.jpg?width=600" },

    id: "hookah", icon: "💨", name: "قلیان",

      { name: "قلیان مسکو", description: "تنباکوی مسکو با طعم خنک و تازه", price: 245, badge: "", imageUrl: "https://commons.wikimedia.org/wiki/Special:FilePath/File:Hookah%20Pipes%20at%20a%20Hookah%20lounge%20by%20Don%20Ramey%20Logan.jpg?width=600" },
      { name: "قلیان آدامس دارچین", description: "تنباکوی آدامس دارچین با طعم شیرین و تند", price: 345, badge: "", imageUrl: "https://commons.wikimedia.org/wiki/Special:FilePath/File:Flickr%20-%20DavidDennisPhotos.com%20-%20Hookah-Shisha%20Pipes.jpg?width=600" },

/* 📸 گالری حال‌وهوا — عکس‌ها توی پوشه‌ی images هستن
   اگه گالری رو نمی‌خوای، بین [ ] رو خالی کن: [ ]               */
const GALLERY = [
  { img: "images/gallery-1.jpg", cap: "سالن کافه" },
  { img: "images/gallery-2.jpg", cap: "بار و ویترین" },
  { img: "images/gallery-3.jpg", cap: "بار قهوه" },
  { img: "images/gallery-4.jpg", cap: "جزئیات رترو" },
];

/* ═══════════════ پایان داده‌ها — از این‌جا به بعد دست نزن ═══════════════ */

const $ = s => document.querySelector(s);
const fa = n => Number(n).toLocaleString('fa-IR');
const faDigits = s => String(s).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const norm = s => String(s).replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/\u200c/g,' ').toLowerCase();
const BADGE = {
  special:  { txt: 'پیشنهاد ویژه', cls: 'special' },
  new:      { txt: 'جدید',         cls: 'new' },
  soldout:  { txt: 'ناتمام',       cls: 'soldout' },
};
const priceTxt = p => fa(p) + ' هزار تومان';

/* هدر */
document.title = CAFE.name + ' | منو';
$('#hero-name').textContent = CAFE.name;
$('#hero-tagline').textContent = CAFE.tagline;
if (!CAFE.tagline) $('#hero-tagline').remove();
if (CAFE.hours) { $('#hero-hours').textContent = CAFE.hours; } else { $('#hero-hours-pill').remove(); }

/* فوتر — هر فیلدی خالی باشه نمایش داده نمی‌شه */
if (CAFE.phone) {
  $('#f-tel').hidden = false;
  $('#f-tel').href = 'tel:+' + String(CAFE.phone).replace(/^\+/, '');
  $('#f-tel').innerHTML = '📞 تماس با کافه — <span dir="ltr">' + faDigits(CAFE.phone) + '</span>';
}
if (CAFE.address) { $('#f-address').hidden = false; $('#f-address').textContent = '📍 ' + CAFE.address; }
if (CAFE.instagram) {
  $('#f-ig').hidden = false;
  $('#f-ig').innerHTML = 'اینستاگرام: <a href="https://instagram.com/' + encodeURIComponent(CAFE.instagram) + '" dir="ltr">@' + CAFE.instagram + '</a>';
}
if (CAFE.hours) { $('#f-hours').hidden = false; $('#f-hours').textContent = CAFE.hours; }

/* ساخت دسته‌بندی‌ها و کارت‌ها */
const chipsEl = $('#chips'), menuEl = $('#menu');
CATEGORIES.forEach((cat, i) => {
  const chip = document.createElement('button');
  chip.className = 'chip' + (i === 0 ? ' on' : '');
  chip.dataset.cat = cat.id;
  chip.textContent = cat.icon + ' ' + cat.name;
  chip.onclick = () => {
    document.getElementById('sec-' + cat.id).scrollIntoView({ behavior: 'smooth', block: 'start' });
    setActive(cat.id);
  };
  chipsEl.appendChild(chip);

  const sec = document.createElement('section');
  sec.id = 'sec-' + cat.id;
  sec.innerHTML = '<div class="sec-head"><span class="ico">' + cat.icon + '</span><h2>' + cat.name + '</h2><span class="rule"></span></div>';
  cat.items.forEach(it => {
    const b = BADGE[it.badge];
    const card = document.createElement('article');
    card.className = 'card' + (it.badge === 'soldout' ? ' out' : '');
    card.innerHTML =
      '<div class="ph">' + cat.icon +
        (it.imageUrl ? '<img src="' + it.imageUrl + '" alt="' + it.name + '" loading="lazy" onerror="this.remove()">' : '') +
      '</div>' +
      '<div class="info">' +
        '<div class="nm">' + it.name + (b ? ' <span class="bd ' + b.cls + '">' + b.txt + '</span>' : '') + '</div>' +
        (it.description ? '<div class="ds">' + it.description + '</div>' : '') +
        '<div class="pr">' + priceTxt(it.price) + '</div>' +
      '</div>';
    sec.appendChild(card);
  });
  menuEl.appendChild(sec);
});

/* گالری + لایت‌باکس */
if (GALLERY.length) {
  const sec = document.createElement('section');
  sec.id = 'sec-gallery';
  sec.innerHTML = '<div class="sec-head"><span class="ico">📸</span><h2>حال‌وهوای رترو</h2><span class="rule"></span></div>';
  const g = document.createElement('div');
  g.className = 'gallery';
  GALLERY.forEach(ph => {
    const f = document.createElement('figure');
    f.innerHTML = '<img src="' + ph.img + '" alt="' + ph.cap + '" loading="lazy"><figcaption>' + ph.cap + '</figcaption>';
    f.onclick = () => openLightbox(ph.img);
    g.appendChild(f);
  });
  sec.appendChild(g);
  menuEl.appendChild(sec);
}
const lb = document.createElement('div');
lb.id = 'lightbox';
lb.innerHTML = '<img alt="">';
lb.onclick = () => { lb.classList.remove('on'); document.body.style.overflow = ''; };
document.body.appendChild(lb);
function openLightbox(src) {
  lb.querySelector('img').src = src;
  lb.classList.add('on');
  document.body.style.overflow = 'hidden';
}

/* نوار چسبان: برند کوچک + اسکرول‌اسپای */
const bar = $('#bar'), hero = $('.hero');
function setActive(id) {
  chipsEl.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.dataset.cat === id));
  const on = chipsEl.querySelector('.chip.on');
  if (on) on.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
}
let ticking = false;
addEventListener('scroll', () => {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => {
    ticking = false;
    bar.classList.toggle('scrolled', scrollY > hero.offsetHeight - 60);
    if (document.body.classList.contains('searching')) return;
    let cur = CATEGORIES[0].id;
    for (const c of CATEGORIES) {
      if (document.getElementById('sec-' + c.id).offsetTop - 170 <= scrollY) cur = c.id;
    }
    const active = chipsEl.querySelector('.chip.on');
    if (!active || active.dataset.cat !== cur) setActive(cur);
  });
}, { passive: true });

/* جستجو */
const q = $('#q'), resEl = $('#results');
q.addEventListener('input', () => {
  const query = norm(q.value).trim();
  resEl.innerHTML = '';
  if (!query) {
    document.body.classList.remove('searching');
    resEl.hidden = true;
    return;
  }
  document.body.classList.add('searching');
  resEl.hidden = false;
  const hits = [];
  CATEGORIES.forEach(cat => cat.items.forEach(it => {
    if (norm(it.name + ' ' + (it.description || '')).includes(query))
      hits.push({ cat, it });
  }));
  const title = document.createElement('p');
  title.className = 'res-title';
  title.innerHTML = hits.length
    ? faDigits(hits.length) + ' مورد برای «<b>' + q.value.trim() + '</b>» پیدا شد'
    : '';
  resEl.appendChild(title);
  if (!hits.length) {
    resEl.innerHTML = '<div class="empty"><span class="big">🔍</span>چیزی با این اسم توی منو پیدا نشد</div>';
    return;
  }
  hits.forEach(({ cat, it }) => {
    const b = BADGE[it.badge];
    const card = document.createElement('article');
    card.className = 'card' + (it.badge === 'soldout' ? ' out' : '');
    card.innerHTML =
      '<div class="ph">' + cat.icon +
        (it.imageUrl ? '<img src="' + it.imageUrl + '" alt="' + it.name + '" loading="lazy" onerror="this.remove()">' : '') +
      '</div>' +
      '<div class="info">' +
        '<div class="nm">' + it.name +
          (b ? ' <span class="bd ' + b.cls + '">' + b.txt + '</span>' : '') +
          ' <span style="color:var(--muted);font-size:.72rem;font-weight:400">' + cat.icon + ' ' + cat.name + '</span>' +
        '</div>' +
        (it.description ? '<div class="ds">' + it.description + '</div>' : '') +
        '<div class="pr">' + priceTxt(it.price) + '</div>' +
      '</div>';
    resEl.appendChild(card);
  });
});

/* PWA — کش آفلاین بعد از اولین بازدید */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
