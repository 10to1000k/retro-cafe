<style>
  @font-face{font-family:'Vazirmatn';src:url('fonts/Vazirmatn-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
  @font-face{font-family:'Vazirmatn';src:url('fonts/Vazirmatn-Medium.woff2') format('woff2');font-weight:500;font-display:swap}
  @font-face{font-family:'Vazirmatn';src:url('fonts/Vazirmatn-Bold.woff2') format('woff2');font-weight:700;font-display:swap}

  :root{
    --text:#f6ecdc;
    --muted:#c7ad8e;
    --accent:#e9b168;
    --accent-dark:#241407;
    --card:rgba(32,21,14,.72);
    --line:rgba(255,255,255,.09);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html{scroll-behavior:smooth}
  body{
    font-family:'Vazirmatn','Segoe UI',Tahoma,sans-serif;
    color:var(--text);
    min-height:100vh;
    padding-bottom:calc(28px + env(safe-area-inset-bottom));
    overflow-x:hidden;
  }

  /* ── پس‌زمینه: عکس + لایه‌ی تیره (اگه عکس نباشه، گرادیان قهوه‌ای) ── */
  .bg{position:fixed;inset:0;z-index:-3;background:linear-gradient(175deg,#41291a 0%,#2b1a10 45%,#170e08 100%)}
  .bg-photo{position:fixed;inset:0;z-index:-2;background:url('images/background.jpg') center/cover no-repeat;opacity:.9}
  .bg-photo::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(23,14,8,.62) 0%,rgba(23,14,8,.55) 30%,rgba(23,14,8,.88) 100%)}

  /* ── هدر ── */
  .hero{text-align:center;padding:44px 20px 20px}
  .hero .mark{
    width:76px;height:76px;margin:0 auto 14px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:2.1rem;
    background:rgba(255,255,255,.07);border:1px solid rgba(233,177,104,.4);
    box-shadow:0 8px 30px rgba(0,0,0,.35);
  }
  .hero h1{font-size:2rem;font-weight:700;letter-spacing:.3px;text-shadow:0 2px 18px rgba(0,0,0,.5)}
  .hero .tagline{color:var(--muted);font-size:.95rem;margin-top:6px}
  .hero .hours{
    display:inline-flex;align-items:center;gap:7px;margin-top:14px;
    padding:7px 16px;border-radius:999px;font-size:.82rem;color:var(--text);
    background:rgba(255,255,255,.07);border:1px solid var(--line);backdrop-filter:blur(8px);
  }

  /* ── توپ‌بار ── */
  .topbar{
    position:sticky;top:0;z-index:50;
    background:rgba(20,13,9,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid var(--line);
  }
  .topbar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 14px}
  .back{
    width:38px;height:38px;flex-shrink:0;border-radius:12px;text-decoration:none;
    display:flex;align-items:center;justify-content:center;font-size:1.25rem;color:var(--text);
    background:rgba(255,255,255,.07);border:1px solid var(--line);
  }
  .topbar-title{flex:1;font-weight:700;font-size:1rem;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .count{color:var(--muted);font-size:.75rem;white-space:nowrap}
  .search{position:relative;margin:14px 0 2px}
  .search input{
    width:100%;padding:10px 40px 10px 14px;border-radius:13px;
    background:rgba(255,255,255,.07);border:1px solid var(--line);
    color:var(--text);font:inherit;font-size:.9rem;outline:none;
  }
  .search input::placeholder{color:rgba(199,173,142,.75)}
  .search input:focus{border-color:rgba(233,177,104,.55)}
  .search .ic{position:absolute;right:13px;top:50%;transform:translateY(-50%);font-size:.95rem;pointer-events:none;opacity:.8}

  /* ── خوش‌آمد ── */
  .welcome-cta{text-align:center;padding:12px 20px 4px}
  .cta{
    display:inline-flex;align-items:center;gap:10px;text-decoration:none;
    background:linear-gradient(135deg,#f0c078,#d9973f);color:var(--accent-dark);
    font-weight:700;font-size:1.05rem;padding:15px 48px;border-radius:17px;
    box-shadow:0 8px 28px rgba(217,151,63,.35);
  }
  .cta:active{transform:scale(.97)}
  .welcome-hint{color:var(--muted);font-size:.82rem;margin-top:12px}

  /* ── گرید دسته‌ها ── */
  .catgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0 6px}
  .catcard{
    position:relative;display:block;height:152px;border-radius:18px;overflow:hidden;
    border:1px solid var(--line);background:rgba(255,255,255,.05);
    text-decoration:none;color:var(--text);
  }
  .catcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .catcard .catico{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:3rem}
  .catcard .shade{position:absolute;inset:0;background:linear-gradient(0deg,rgba(10,6,3,.9) 0%,rgba(10,6,3,.25) 62%,rgba(10,6,3,.12) 100%)}
  .catcard .meta{position:absolute;right:0;left:0;bottom:0;padding:10px 12px}
  .catcard .nm{font-weight:700;font-size:.95rem}
  .catcard .ct{color:var(--muted);font-size:.72rem;margin-top:2px}
  .catcard .go{
    position:absolute;top:8px;left:8px;width:30px;height:30px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:.95rem;color:var(--accent-dark);
    background:linear-gradient(135deg,#f0c078,#d9973f);
  }

  /* ── بدنه ── */
  .view{max-width:560px;margin:0 auto;padding:4px 16px;animation:fadeUp .28s ease}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  main{max-width:560px;margin:0 auto;padding:4px 0}
  #items{margin-top:12px}
  section{margin-top:28px}
  .sec-head{display:flex;align-items:center;gap:10px;margin-bottom:13px}
  .sec-head .ico{font-size:1.25rem}
  .sec-head h2{font-size:1.12rem;font-weight:700;white-space:nowrap}
  .sec-head .rule{flex:1;height:1px;background:linear-gradient(-90deg,rgba(233,177,104,.4),transparent)}

  .card{
    display:flex;align-items:center;gap:14px;
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:12px;margin-bottom:10px;backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
  }
  .card .info{flex:1;min-width:0}
  .card .nm{font-size:.98rem;font-weight:700;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .card .ds{
    color:var(--muted);font-size:.78rem;margin-top:4px;line-height:1.9;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .card .pr{color:var(--accent);font-weight:700;font-size:.95rem;margin-top:7px}
  .ph{
    width:92px;height:92px;border-radius:16px;flex-shrink:0;overflow:hidden;position:relative;
    background:rgba(255,255,255,.06);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:2rem;
  }
  .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .card.out .ph img{filter:grayscale(.7)}

  .bd{font-size:.67rem;padding:2.5px 9px;border-radius:999px;border:1px solid;font-weight:500}
  .bd.special{color:#f2c57e;border-color:rgba(242,197,126,.45);background:rgba(242,197,126,.12)}
  .bd.new{color:#96d8a0;border-color:rgba(150,216,160,.4);background:rgba(150,216,160,.1)}
  .bd.soldout{color:#e29a9a;border-color:rgba(226,154,154,.4);background:rgba(226,154,154,.1)}
  .card.out{opacity:.5}
  .card.out .pr{text-decoration:line-through;text-decoration-color:rgba(226,154,154,.6)}

  /* ── گالری ── */
  .gallery{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
  .gallery::-webkit-scrollbar{display:none}
  .gallery figure{
    position:relative;flex-shrink:0;width:148px;height:190px;border-radius:16px;overflow:hidden;
    border:1px solid var(--line);cursor:zoom-in;
  }
  .gallery img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
  .gallery figure:active img{transform:scale(1.06)}
  .gallery figcaption{
    position:absolute;right:0;left:0;bottom:0;padding:22px 10px 8px;font-size:.72rem;
    background:linear-gradient(0deg,rgba(10,6,3,.85),transparent);
  }
  #lightbox{
    position:fixed;inset:0;z-index:200;background:rgba(8,5,3,.94);
    display:none;align-items:center;justify-content:center;padding:18px;cursor:zoom-out;
  }
  #lightbox.on{display:flex}
  #lightbox img{max-width:100%;max-height:100%;border-radius:14px}

  /* ── جستجو ── */
  #results{margin-top:22px}
  .res-title{color:var(--muted);font-size:.85rem;margin-bottom:13px;text-align:center}
  .res-title b{color:var(--accent)}
  .empty{text-align:center;color:var(--muted);padding:46px 0;font-size:.9rem}
  .empty .big{font-size:2.2rem;display:block;margin-bottom:10px}
  body.searching #catgrid{display:none}

  /* ── فوتر ── */
  footer{max-width:560px;margin:46px auto 0;padding:0 20px;text-align:center}
  footer .rule{height:1px;background:linear-gradient(90deg,transparent,rgba(233,177,104,.4),transparent);margin-bottom:22px}
  .tel{
    display:inline-flex;align-items:center;gap:9px;text-decoration:none;
    background:linear-gradient(135deg,#f0c078,#d9973f);color:var(--accent-dark);
    font-weight:700;font-size:.95rem;padding:12px 30px;border-radius:15px;
    box-shadow:0 6px 24px rgba(217,151,63,.3);
  }
  .frow{color:var(--muted);font-size:.85rem;line-height:2.2;margin-top:13px}
  .frow a{color:var(--accent);text-decoration:none}
  .credit{margin-top:22px;font-size:.75rem;color:rgba(199,173,142,.55)}
</style>
</head>

/* 📸 گالری حال‌وهوا — عکس‌ها توی پوشه‌ی images هستن
   اگه گالری رو نمی‌خوای، بین [ ] رو خالی کن: [ ]               */
const GALLERY = [
  { img: "images/gallery-1.jpg", cap: "سالن کافه" },
  { img: "images/gallery-2.jpg", cap: "بار و ویترین" },
  { img: "images/gallery-3.jpg", cap: "بار قهوه" },
  { img: "images/gallery-4.jpg", cap: "جزئیات رترو" },
];

/* ═══════════════ پایان داده‌ها — از این‌جا به بعد دست نزن ═══════════════ */

const $ = s => document.querySelector(s);
const fa = n => Number(n).toLocaleString('fa-IR');
const faDigits = s => String(s).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const norm = s => String(s).replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/\u200c/g,' ').toLowerCase();
const BADGE = {
  special:  { txt: 'پیشنهاد ویژه', cls: 'special' },
  new:      { txt: 'جدید',         cls: 'new' },
  soldout:  { txt: 'ناتمام',       cls: 'soldout' },
};
const priceTxt = p => fa(p) + ' هزار تومان';

/* هدر */
document.title = CAFE.name + ' | منو';
$('#hero-name').textContent = CAFE.name;
$('#hero-tagline').textContent = CAFE.tagline;
if (!CAFE.tagline) $('#hero-tagline').remove();
if (CAFE.hours) { $('#hero-hours').textContent = CAFE.hours; } else { $('#hero-hours-pill').remove(); }

/* فوتر — هر فیلدی خالی باشه نمایش داده نمی‌شه */
if (CAFE.phone) {
  $('#f-tel').hidden = false;
  $('#f-tel').href = 'tel:+' + String(CAFE.phone).replace(/^\+/, '');
  $('#f-tel').innerHTML = '📞 تماس با کافه — <span dir="ltr">' + faDigits(CAFE.phone) + '</span>';
}
if (CAFE.address) { $('#f-address').hidden = false; $('#f-address').textContent = '📍 ' + CAFE.address; }
if (CAFE.instagram) {
  $('#f-ig').hidden = false;
  $('#f-ig').innerHTML = 'اینستاگرام: <a href="https://instagram.com/' + encodeURIComponent(CAFE.instagram) + '" dir="ltr">@' + CAFE.instagram + '</a>';
}
if (CAFE.hours) { $('#f-hours').hidden = false; $('#f-hours').textContent = CAFE.hours; }

/* کارت یک آیتم — withCat برچسب دسته را در نتایج جستجو نشان می‌دهد */
function itemCard(cat, it, withCat) {
  const b = BADGE[it.badge];
  const card = document.createElement('article');
  card.className = 'card' + (it.badge === 'soldout' ? ' out' : '');
  card.innerHTML =
    '<div class="ph">' + cat.icon +
      (it.imageUrl ? '<img src="' + it.imageUrl + '" alt="' + it.name + '" loading="lazy" onerror="this.remove()">' : '') +
    '</div>' +
    '<div class="info">' +
      '<div class="nm">' + it.name +
        (b ? ' <span class="bd ' + b.cls + '">' + b.txt + '</span>' : '') +
        (withCat ? ' <span style="color:var(--muted);font-size:.72rem;font-weight:400">' + cat.icon + ' ' + cat.name + '</span>' : '') +
      '</div>' +
      (it.description ? '<div class="ds">' + it.description + '</div>' : '') +
      '<div class="pr">' + priceTxt(it.price) + '</div>' +
    '</div>';
  return card;
}

/* ساخت کارت دسته‌ها (ویو ۲) */
$('#menu-name').textContent = CAFE.name;
const gridEl = $('#catgrid');
CATEGORIES.forEach(cat => {
  const a = document.createElement('a');
  a.className = 'catcard';
  a.href = '#/cat/' + cat.id;
  a.innerHTML =
    (cat.items[0] && cat.items[0].imageUrl
      ? '<img src="' + cat.items[0].imageUrl + '" alt="' + cat.name + '" loading="lazy">'
      : '<div class="catico">' + cat.icon + '</div>') +
    '<div class="shade"></div>' +
    '<span class="go">←</span>' +
    '<div class="meta"><div class="nm">' + cat.icon + ' ' + cat.name + '</div>' +
    '<div class="ct">' + fa(cat.items.length) + ' آیتم</div></div>';
  gridEl.appendChild(a);
});

/* رندر آیتم‌های یک دسته (ویو ۳) */
const itemsEl = $('#items');
function renderItems(id) {
  const cat = CATEGORIES.find(c => c.id === id) || CATEGORIES[0];
  $('#items-ico').textContent = cat.icon;
  $('#items-name').textContent = cat.name;
  $('#items-count').textContent = fa(cat.items.length) + ' آیتم';
  document.title = cat.name + ' | ' + CAFE.name;
  itemsEl.innerHTML = '';
  cat.items.forEach(it => itemsEl.appendChild(itemCard(cat, it, false)));
}

/* گالری + لایت‌باکس */
if (GALLERY.length) {
  const sec = document.createElement('section');
  sec.id = 'sec-gallery';
  sec.innerHTML = '<div class="sec-head"><span class="ico">📸</span><h2>حال‌وهوای رترو</h2><span class="rule"></span></div>';
  const g = document.createElement('div');
  g.className = 'gallery';
  GALLERY.forEach(ph => {
    const f = document.createElement('figure');
    f.innerHTML = '<img src="' + ph.img + '" alt="' + ph.cap + '" loading="lazy"><figcaption>' + ph.cap + '</figcaption>';
    f.onclick = () => openLightbox(ph.img);
    g.appendChild(f);
  });
  sec.appendChild(g);
  $('#home-gallery').appendChild(sec);
}
const lb = document.createElement('div');
lb.id = 'lightbox';
lb.innerHTML = '<img alt="">';
lb.onclick = () => { lb.classList.remove('on'); document.body.style.overflow = ''; };
document.body.appendChild(lb);
function openLightbox(src) {
  lb.querySelector('img').src = src;
  lb.classList.add('on');
  document.body.style.overflow = 'hidden';
}

/* روتر: خوش‌آمد ← دسته‌ها ← آیتم‌ها (دکمه برگشت گوشی هم کار می‌کند) */
const views = { home: $('#view-home'), menu: $('#view-menu'), items: $('#view-items') };
function show(name) {
  Object.keys(views).forEach(k => { views[k].hidden = (k !== name); });
  scrollTo(0, 0);
}
function route() {
  const h = location.hash || '#/';
  q.value = '';
  resEl.innerHTML = '';
  resEl.hidden = true;
  document.body.classList.remove('searching');
  if (h.indexOf('#/cat/') === 0) {
    renderItems(h.slice(6));
    show('items');
  } else if (h === '#/menu') {
    document.title = 'منو | ' + CAFE.name;
    show('menu');
  } else {
    document.title = CAFE.name + ' | خوش آمدید';
    show('home');
  }
}
addEventListener('hashchange', route);

/* جستجو */
const q = $('#q'), resEl = $('#results');
q.addEventListener('input', () => {
  const query = norm(q.value).trim();
  resEl.innerHTML = '';
  if (!query) {
    document.body.classList.remove('searching');
    resEl.hidden = true;
    return;
  }
  document.body.classList.add('searching');
  resEl.hidden = false;
  const hits = [];
  CATEGORIES.forEach(cat => cat.items.forEach(it => {
    if (norm(it.name + ' ' + (it.description || '')).includes(query))
      hits.push({ cat, it });
  }));
  const title = document.createElement('p');
  title.className = 'res-title';
  title.innerHTML = hits.length
    ? faDigits(hits.length) + ' مورد برای «<b>' + q.value.trim() + '</b>» پیدا شد'
    : '';
  resEl.appendChild(title);
  if (!hits.length) {
    resEl.innerHTML = '<div class="empty"><span class="big">🔍</span>چیزی با این اسم توی منو پیدا نشد</div>';
    return;
  }
  hits.forEach(({ cat, it }) => resEl.appendChild(itemCard(cat, it, true)));
});

/* شروع از مسیر فعلی */
route();

/* PWA — کش آفلاین بعد از اولین بازدید */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>

</html>
