<!DOCTYPE html>
<!--
  ┌─────────────────────────────────────────────────────────────┐
  │         منوی دیجیتال RETRO CAFE  —  نسخه‌ی موبایل (QR)        │
  │                                                             │
  │  برای ویرایش منو (قیمت، آیتم، اسم کافه…) برو به بخش          │
  │  «⚙️ داده‌های منو» در پایین همین فایل.                        │
  │  راهنمای کامل: فایل README.md                                │
  └─────────────────────────────────────────────────────────────┘
-->
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D63A2F">
<meta name="color-scheme" content="light">
<meta name="description" content="منوی دیجیتال RETRO CAFE — نوشیدنی گرم، دمنوش، آیس کافی، شیک، غذا و قلیان">
<meta property="og:title" content="RETRO CAFE | منو">
<meta property="og:description" content="منوی دیجیتال RETRO CAFE">
<meta property="og:type" content="website">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>RETRO CAFE | منو</title>
<style>
  @font-face{font-family:'Vazirmatn';src:url('fonts/Vazirmatn-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
  @font-face{font-family:'Vazirmatn';src:url('fonts/Vazirmatn-Medium.woff2') format('woff2');font-weight:500;font-display:swap}
  @font-face{font-family:'Vazirmatn';src:url('fonts/Vazirmatn-Bold.woff2') format('woff2');font-weight:700;font-display:swap}
  @font-face{font-family:'Vazirmatn';src:url('fonts/Vazirmatn-Bold.woff2') format('woff2');font-weight:800;font-display:swap}
  /* نشان‌واره‌ی لاتین لوگو (فقط حروف لاتین — حجم کم) */
  @font-face{font-family:'AlfaSlabOne';src:url('fonts/AlfaSlabOne-Latin.woff2') format('woff2');font-weight:400;font-display:swap}

  /* ═══ سیستم رنگ رترو: کرم / قهوه‌ای چوب / قرمز / طلایی ═══ */
  :root{
    --bg:#FFF8EE;
    --surface:#FFFFFF;
    --ink:#2A1D13;
    --ink-soft:#6B5745;
    --muted:#A08A73;
    --accent:#D63A2F;
    --accent-deep:#9E2E1F;
    --accent-soft:#FDEAE5;
    --gold:#FFB627;
    --gold-deep:#B87A16;
    --gold-soft:#FFF4DC;
    --green:#2F7A3D;
    --green-soft:#E9F4EA;
    --line:#F0E3D1;
    --wood:#8A5A2B;
    --shadow:0 10px 30px rgba(120,70,40,.10);
    --shadow-sm:0 3px 12px rgba(120,70,40,.08);
    --r-lg:22px; --r-md:16px; --r-sm:12px;
    --head-h:104px;               /* ارتفاع هدر چسبان — با JS به‌روز می‌شه */
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
  body{
    font-family:'Vazirmatn','Segoe UI',Tahoma,sans-serif;
    background:var(--bg);color:var(--ink);
    min-height:100vh;overflow-x:hidden;
    padding-bottom:env(safe-area-inset-bottom);
    line-height:1.6;
  }
  img{display:block;max-width:100%}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

  /* ─────────── اسپلش (خوش‌آمد اول) ─────────── */
  .splash{
    min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#E04A2F,#B3281F);color:#fff;text-align:center;
    padding:24px calc(24px + env(safe-area-inset-right)) 24px calc(24px + env(safe-area-inset-left));
  }
  /* نشان (لوگو) — خود SVG کامل و گرد است، پس ظرف فقط سایز و سایه می‌دهد */
  .logo-badge{
    width:132px;height:132px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 18px 44px rgba(0,0,0,.30);
    animation:pop .5s cubic-bezier(.2,.9,.3,1.2)
  }
  .logo-badge svg{width:100%;height:100%;display:block}
  @keyframes pop{from{transform:scale(.62);opacity:0}to{transform:scale(1);opacity:1}}
  /* اسم کافه همیشه لاتین */
  .brand{font-family:'AlfaSlabOne',Georgia,'Times New Roman',serif;font-weight:400;direction:ltr;unicode-bidi:isolate}
  .splash h1{font-size:2.7rem;line-height:1;margin-top:26px;letter-spacing:.015em}
  .splash h1 .l2{display:block;font-size:1.02rem;letter-spacing:.68em;text-indent:.68em;color:var(--gold);margin-top:14px}
  .splash .fa-sub{font-size:.82rem;opacity:.9;margin-top:16px}
  .splash .skip{margin-top:34px;font-size:.8rem;opacity:.85;border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:8px 20px}
  .dots{display:flex;gap:6px;margin-top:22px}
  .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.45);animation:bl 1.2s infinite}
  .dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
  @keyframes bl{0%,60%,100%{opacity:.35}30%{opacity:1}}

  /* ─────────── سربرگ مشترک صفحه‌ی خوش‌آمد ─────────── */
  .page{min-height:100dvh;display:flex;flex-direction:column}
  .welcome-hero{
    position:relative;overflow:hidden;text-align:center;flex-shrink:0;
    padding:calc(56px + env(safe-area-inset-top)) 24px 42px;
    background:
      radial-gradient(90% 62% at 50% 118%, rgba(255,182,39,.26), rgba(255,182,39,0) 72%),
      repeating-conic-gradient(from 0deg at 50% -35%, rgba(214,58,47,.07) 0deg 10deg, rgba(214,58,47,0) 10deg 20deg),
      var(--bg);
  }
  .welcome-hero .logo-badge{width:112px;height:112px;margin:0 auto;box-shadow:0 14px 34px rgba(214,58,47,.32)}
  .welcome-hero.has-img{
    background-image:linear-gradient(180deg,rgba(26,14,7,.66),rgba(26,14,7,.78)),var(--hero);
    background-size:cover;background-position:center;
  }
  .welcome-hero.has-img{
    padding-top:calc(72px + env(safe-area-inset-top));padding-bottom:54px;
    box-shadow:inset 0 -46px 46px -40px rgba(0,0,0,.45);
  }
  .welcome-hero.has-img h1,.welcome-hero.has-img .tagline{color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.35)}
  .welcome-hero.has-img .hint{color:#F3E5D6}
  .welcome-hero.has-img .hint b{color:var(--gold)}
  .welcome-hero.has-img .tagline{opacity:.94}
  .welcome-hero h1{font-size:1.72rem;margin-top:20px;letter-spacing:.045em}
  .wstats{display:flex;gap:10px;justify-content:center;margin-top:18px}
  .wstat{
    background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:16px;
    padding:9px 16px;min-width:80px;box-shadow:var(--shadow-sm)
  }
  .wstat b{display:block;font-size:1.1rem;font-weight:800;color:var(--accent-deep);line-height:1.5}
  .wstat span{font-size:.68rem;color:var(--ink-soft)}
  .hint{margin-top:16px;font-size:.78rem;color:var(--ink-soft)}
  .hint b{color:var(--accent-deep)}
  .welcome-hero .tagline{color:var(--ink-soft);font-size:.95rem;margin-top:6px}
  .pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
  .pill{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--surface);border:1px solid var(--line);border-radius:999px;
    padding:7px 14px;font-size:.78rem;color:var(--ink-soft);box-shadow:var(--shadow-sm)
  }
  .pill.open{color:var(--green);border-color:#CBE6CF;background:var(--green-soft)}
  .pill.closed{color:#B04444;border-color:#EFC9C9;background:#FAEDED}
  .pill b{font-weight:700}

  .welcome-body{flex:1;width:100%;max-width:600px;margin:0 auto;padding:0 18px calc(28px + env(safe-area-inset-bottom))}
  /* سرعنوان بخش دسته‌بندی‌ها — به‌جای متن قبلی، یک تیتر آرام با خط تزئینی */
  .lead{
    display:flex;align-items:center;gap:12px;
    font-size:.95rem;font-weight:800;color:var(--ink-soft);margin:6px 0 16px
  }
  .lead::before,.lead::after{content:'';flex:1;height:1px;background:var(--line)}
  .catgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (min-width:520px){.catgrid{grid-template-columns:1fr 1fr 1fr}}
  .catcard{
    position:relative;overflow:hidden;text-decoration:none;
    background:var(--surface);border:1px solid rgba(42,29,19,.06);border-radius:var(--r-lg);
    padding:14px 12px 13px;box-shadow:var(--shadow-sm);text-align:center;
    transition:transform .16s ease, box-shadow .16s ease;
  }
  .catcard:active{transform:scale(.97)}
  .catcard .ic{
    width:52px;height:52px;margin:0 auto 9px;border-radius:16px;
    display:flex;align-items:center;justify-content:center;font-size:1.5rem;
    background:var(--gold-soft);border:1px solid #F5E4C2;overflow:hidden;position:relative
  }
  .catcard .ic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .catcard .nm{font-weight:700;font-size:.92rem;line-height:1.45}
  .catcard .ct{color:var(--muted);font-size:.72rem;margin-top:3px}
  .cta{
    display:flex;align-items:center;justify-content:center;gap:9px;text-decoration:none;text-align:center;
    background:linear-gradient(135deg,#E04A2F,#C0301F);color:#fff;
    font-weight:700;font-size:1.02rem;padding:16px 22px;border-radius:999px;margin-top:18px;
    box-shadow:0 10px 26px rgba(214,58,47,.38);
  }
  .cta:active{transform:scale(.985)}

  /* ─────────── فوتر ─────────── */
  footer{max-width:600px;margin:34px auto 0;padding:0 18px;text-align:center;width:100%}
  .fcard{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
    box-shadow:var(--shadow-sm);padding:6px 14px;text-align:right;overflow:hidden
  }
  .frow{
    display:flex;align-items:center;gap:12px;padding:13px 2px;
    text-decoration:none;font-size:.9rem;border-bottom:1px solid var(--line)
  }
  .frow:last-child{border-bottom:0}
  .frow .fi{
    width:38px;height:38px;flex-shrink:0;border-radius:12px;background:var(--gold-soft);
    display:flex;align-items:center;justify-content:center;font-size:1.05rem
  }
  .frow .fb{min-width:0;flex:1}
  .frow .fl{display:block;color:var(--muted);font-size:.7rem;line-height:1.7}
  .frow .fv{font-weight:500;color:var(--ink);word-break:break-word}
  .frow.tap{background:linear-gradient(135deg,#E04A2F,#C0301F);border-radius:var(--r-md);padding:12px 16px;margin:10px 0;border-bottom:0;color:#fff;justify-content:center;font-weight:700;box-shadow:0 8px 20px rgba(214,58,47,.32)}
  .frow.tap .fi{background:rgba(255,255,255,.2)}
  .credit{margin:20px 0 0;font-size:.72rem;color:#BFAF9B;line-height:2}

  /* ─────────── هدر چسبان منو ─────────── */
  .topbar{
    position:sticky;top:0;z-index:60;
    background:rgba(255,248,238,.94);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
    padding-top:env(safe-area-inset-top);
  }
  .tb-row{display:flex;align-items:center;gap:10px;max-width:720px;margin:0 auto;padding:10px 14px 8px}
  .icon-btn{
    width:42px;height:42px;flex-shrink:0;border-radius:14px;text-decoration:none;
    display:flex;align-items:center;justify-content:center;font-size:1.15rem;
    background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm)
  }
  .search{position:relative;flex:1;min-width:0}
  .search input{
    width:100%;padding:11px 42px 11px 40px;border-radius:14px;
    background:var(--surface);border:1px solid var(--line);
    color:var(--ink);font:inherit;font-size:.9rem;outline:none;box-shadow:var(--shadow-sm)
  }
  .search input::placeholder{color:#B9A88F}
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(214,58,47,.12)}
  .search .ic{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:.92rem;pointer-events:none;opacity:.6}
  .search .clr{
    position:absolute;left:8px;top:50%;transform:translateY(-50%);
    width:26px;height:26px;border-radius:50%;background:var(--gold-soft);color:var(--wood);
    font-size:.8rem;display:flex;align-items:center;justify-content:center
  }
  /* ─────────── بدنه‌ی منو ─────────── */
  .menu-wrap{max-width:720px;margin:0 auto;padding:0 16px}
  .menu-hero{
    margin:16px 0 6px;border-radius:var(--r-lg);overflow:hidden;position:relative;
    background:linear-gradient(135deg,#2F2016,#5A3A22);color:#fff;
    padding:20px 18px;box-shadow:var(--shadow)
  }
  .menu-hero::after{
    content:'';position:absolute;inset:0;opacity:.5;
    background:repeating-conic-gradient(from 0deg at 108% -20%, rgba(255,182,39,.16) 0deg 9deg, rgba(255,182,39,0) 9deg 18deg)
  }
  .menu-hero>div{position:relative;z-index:1;display:flex;align-items:center;gap:14px}
  .menu-hero h1{font-size:1.12rem;letter-spacing:.04em}
  .menu-hero p{font-size:.78rem;opacity:.85;margin-top:3px}
  .menu-hero.has-img{
    background-image:linear-gradient(120deg,rgba(26,14,7,.88),rgba(26,14,7,.52)),var(--hero);
    background-size:cover;background-position:center;
  }
  .menu-hero.has-img::after{display:none}
  .menu-hero .pills{position:relative;z-index:1;margin-top:14px;justify-content:flex-start}
  .menu-hero .pill{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:none}
  .menu-hero .pill.open{background:rgba(47,122,61,.9);border-color:transparent;color:#fff}
  .menu-hero .pill.closed{background:rgba(176,68,68,.9);border-color:transparent;color:#fff}
  .menu-hero .logo-badge{width:58px;height:58px;box-shadow:none;animation:none}

  /* پیشنهاد ویژه */
  .specials{margin-top:22px}
  .spec-head{display:flex;align-items:baseline;gap:8px;margin-bottom:12px;padding:0 2px}
  .spec-head h2{font-size:1.02rem;font-weight:800}
  .spec-head span{color:var(--muted);font-size:.74rem}
  .spec-strip{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 8px;scroll-snap-type:x mandatory}
  .spec-strip::-webkit-scrollbar{display:none}
  .spec{
    flex:0 0 46%;max-width:190px;scroll-snap-align:start;position:relative;
    background:var(--surface);border:1px solid rgba(42,29,19,.06);border-radius:var(--r-md);
    overflow:hidden;box-shadow:var(--shadow-sm);text-decoration:none
  }
  @media (min-width:560px){.spec{flex-basis:32%}}
  .spec .im{aspect-ratio:4/3;background:var(--gold-soft);display:flex;align-items:center;justify-content:center;font-size:1.8rem;overflow:hidden;position:relative}
  .spec .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .spec .bdg{
    position:absolute;top:8px;right:8px;z-index:2;
    background:var(--gold);color:#3A2408;font-size:.64rem;font-weight:800;
    border-radius:999px;padding:3px 9px;box-shadow:0 3px 10px rgba(0,0,0,.18)
  }
  .spec .tx{padding:10px 11px 12px}
  .spec .nm{font-size:.85rem;font-weight:700;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
  .spec .pr{margin-top:7px;font-size:.85rem;font-weight:800;color:var(--accent-deep)}

  /* دسته و آیتم‌ها */
  .cat{margin-top:30px;scroll-margin-top:calc(var(--head-h) + 10px)}
  .cat-head{display:flex;align-items:center;gap:10px;margin-bottom:13px;padding:0 2px}
  .cat-head .ico{
    width:38px;height:38px;flex-shrink:0;border-radius:12px;background:var(--gold-soft);
    display:flex;align-items:center;justify-content:center;font-size:1.1rem;border:1px solid #F5E4C2
  }
  .cat-head h2{font-size:1.06rem;font-weight:800}
  .cat-head .ct{color:var(--muted);font-size:.73rem;font-weight:400;margin-inline-start:2px}
  .cat-head .rule{flex:1;height:1px;background:var(--line)}

  .card{
    display:flex;align-items:stretch;gap:13px;
    background:var(--surface);border:1px solid rgba(42,29,19,.055);border-radius:var(--r-lg);
    padding:12px;margin-bottom:11px;box-shadow:var(--shadow-sm)
  }
  .card .ph{
    width:92px;height:92px;border-radius:var(--r-md);flex-shrink:0;overflow:hidden;position:relative;
    background:var(--gold-soft);display:flex;align-items:center;justify-content:center;font-size:1.9rem
  }
  .card .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  /* آیکون‌های خالی (مثلاً قلیان بدون ایموجی) جای اشغال نکنن */
  .card .ph:empty,.cat-head .ico:empty,.catcard .ic:empty,.spec .im:empty{display:none}
  .card .info{flex:1;min-width:0;display:flex;flex-direction:column}
  .card .nm{font-size:.97rem;font-weight:700;display:flex;align-items:center;gap:7px;flex-wrap:wrap;line-height:1.5}
  .card .ds{
    color:var(--muted);font-size:.77rem;margin-top:3px;line-height:1.85;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden
  }
  .card .pr{margin-top:auto;padding-top:6px;font-size:.98rem;font-weight:800;color:var(--accent-deep);white-space:nowrap}
  .card .pr small{font-weight:500;color:var(--muted);font-size:.72rem}
  .card .cat-tag{color:var(--muted);font-size:.7rem;font-weight:400}
  .bd{font-size:.66rem;padding:2.5px 9px;border-radius:999px;border:1px solid;font-weight:700;white-space:nowrap}
  .bd.special{color:#9A5A1E;border-color:#EBD3AC;background:#F9EFD9}
  .bd.new{color:#2F7A3D;border-color:#BFE0C4;background:#E9F4EA}
  .bd.popular{color:#9E2E1F;border-color:#F3C4BB;background:var(--accent-soft)}
  .bd.soldout{color:#B04444;border-color:#EFC9C9;background:#FAEDED}
  .card.out{opacity:.55}
  .card.out .pr{text-decoration:line-through;text-decoration-color:rgba(176,68,68,.55)}
  .card.out .ph img{filter:grayscale(.75)}
  @media (min-width:640px){
    .items{display:grid;grid-template-columns:1fr 1fr;gap:11px}
    .card{margin-bottom:0}
  }

  /* نتایج جستجو */
  #results{margin-top:14px}
  .res-title{color:var(--muted);font-size:.84rem;margin-bottom:13px;text-align:center}
  .res-title b{color:var(--accent-deep)}
  .empty{text-align:center;color:var(--muted);padding:52px 0;font-size:.9rem}
  .empty .big{font-size:2.2rem;display:block;margin-bottom:10px}
  .empty .sug{color:var(--accent-deep);font-weight:700;text-decoration:none}

  /* دکمه بازگشت به بالا */
  #toTop{
    position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:55;
    width:46px;height:46px;border-radius:50%;background:var(--surface);color:var(--ink);
    border:1px solid var(--line);box-shadow:0 8px 22px rgba(120,70,40,.2);
    display:flex;align-items:center;justify-content:center;font-size:1.1rem;
    opacity:0;pointer-events:none;transition:opacity .2s
  }
  #toTop.on{opacity:1;pointer-events:auto}

  /* انیمیشن ورود صفحه‌ها */
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .anim{animation:fadeUp .3s ease both}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001s!important;transition-duration:.001s!important}
    html{scroll-behavior:auto}
  }
</style>
</head>
<body>

<!-- ═══════════ نشان لوگو — یک‌بار تعریف، همه‌جا <use> ═══════════ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="logo-mark" viewBox="0 0 120 120">
    <circle cx="60" cy="60" r="60" fill="#C0301F"/>
    <circle cx="60" cy="60" r="53.5" fill="none" stroke="#FFB627" stroke-width="2.75"/>
    <circle cx="60" cy="60" r="46" fill="#FFF8EE"/>
    <g fill="#F3E4C6" opacity=".55">

      { name: "پنیری مرغ گریل", description: "ساندویچ مرغ گریل با پنیر آب‌شده", price: 545, badge: "", imageUrl: "images/items/%D9%BE%D9%86%DB%8C%D8%B1%DB%8C%20%D9%85%D8%B1%D8%BA%20%DA%AF%D8%B1%DB%8C%D9%84.jpg" },
      { name: "پنیری مرغ پستو", description: "ساندویچ مرغ با سس پستو و پنیر آب‌شده", price: 580, badge: "", imageUrl: "images/items/%D9%BE%D9%86%DB%8C%D8%B1%DB%8C%20%D9%85%D8%B1%D8%BA%20%D9%BE%D8%B3%D8%AA%D9%88.jpg" },

  {
    id: "hookah", icon: "", name: "قلیان",
    items: [
      { name: "قلیان دو سیب", description: "تنباکوی دو سیب سنتی با دود غلیظ", price: 245, badge: "", imageUrl: "images/items/tobacco-double-apple.jpg" },
      { name: "قلیان لاو", description: "تنباکوی لاو با طعم شیرین میوه‌ای", price: 245, badge: "", imageUrl: "images/items/tobacco-love.jpg" },
      { name: "قلیان مسکو", description: "تنباکوی مسکو با طعم خنک و تازه", price: 245, badge: "", imageUrl: "images/items/tobacco-moscow.jpg" },
      { name: "قلیان آدامس دارچین", description: "تنباکوی آدامس دارچین با طعم شیرین و تند", price: 345, badge: "", imageUrl: "images/items/tobacco-cinnamon-gum.jpg" },
    ],
  },
];

/* ═══════════════ پایان داده‌ها — از این‌جا به بعد دست نزن ═══════════════ */

const $  = s => document.querySelector(s);
const fa = n => Number(n).toLocaleString('fa-IR');
const faDigits = s => String(s).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

/* جستجوی فارسی‌فهم: ی/ي، ک/ك، آ/ا، اعداد فارسی و نیم‌فاصله یکسان می‌شن */
const norm = s => String(s)
  .replace(/[يى]/g, 'ی').replace(/ك/g, 'ک')
  .replace(/[آأإٱ]/g, 'ا').replace(/[ۀؤ]/g, 'ه')
  .replace(/[\u200c\u200e\u200f]/g, ' ')
  .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
  .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
  .toLowerCase().trim();

const BADGE = {
  special: { txt: 'پیشنهاد ویژه', cls: 'special' },
  new:     { txt: 'جدید',         cls: 'new' },
  popular: { txt: 'پرطرفدار',     cls: 'popular' },
  soldout: { txt: 'ناموجود',      cls: 'soldout' },
};

/* قیمت: کمتر از ۱۰٬۰۰۰ یعنی «هزار تومان» وارد شده، بیشتر یعنی تومان کامل */
function priceHTML(p){
  const n = Math.max(0, Math.round(Number(p) || 0));
  const toman = n < 10000 ? n * 1000 : n;
  return fa(toman) + ' <small>تومان</small>';
}

/* ─────────── فوتر مشترک ─────────── */
function fillFooter(){
  const html = [];
  if (CAFE.hours) html.push(
    '<div class="frow"><span class="fi">🕐</span><span class="fb">' +
    '<span class="fl">ساعت کاری</span><span class="fv">' + esc(CAFE.hours) + '</span></span></div>');
  if (CAFE.address) html.push(
    '<a class="frow" href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(CAFE.address) +
    '" target="_blank" rel="noopener"><span class="fi">📍</span><span class="fb">' +
    '<span class="fl">آدرس — برای مسیریابی بزن</span><span class="fv">' + esc(CAFE.address) + '</span></span></a>');
  if (CAFE.instagram) html.push(
    '<a class="frow" href="https://instagram.com/' + encodeURIComponent(CAFE.instagram) +
    '" target="_blank" rel="noopener"><span class="fi">📷</span><span class="fb">' +
    '<span class="fl">اینستاگرام</span><span class="fv" dir="ltr">@' + esc(CAFE.instagram) + '</span></span></a>');
  if (CAFE.phone) {
    const dial = String(CAFE.phone).replace(/^\+/, '');
    const intl = dial.startsWith('0') ? '+98' + dial.slice(1) : '+' + dial;
    html.push('<a class="frow tap" href="tel:' + esc(intl) + '"><span class="fi">📞</span> تماس با کافه</a>');
  }
  ['#w-foot', '#m-foot'].forEach(sel => { const el = $(sel); if (el) el.innerHTML = html.join(''); });

  const credit = '☕ ' + CAFE.name + ' — منوی دیجیتال<br>قیمت‌ها به تومان است و ممکن است تغییر کند.';
  const c1 = $('#credit'), c2 = $('#credit2');
  if (c1) c1.innerHTML = credit;
  if (c2) c2.innerHTML = credit;
}

/* ─────────── «الان باز است؟» ─────────── */
function openState(){
  const o = Number(CAFE.openHour), c = Number(CAFE.closeHour);
  if (!(o >= 0 && c > 0 && c > o)) return null;
  const now = new Date();
  const h = now.getHours() + now.getMinutes() / 60;
  const isOpen = h >= o && h < c;
  const t = n => faDigits(String(n).padStart(2, '0')) + ':۰۰';
  return isOpen
    ? { cls: 'open',   txt: 'الان بازیم', detail: 'تا ساعت ' + t(c) }
    : { cls: 'closed', txt: 'الان بسته‌ایم', detail: 'از ساعت ' + t(o) + ' باز می‌شویم' };
}

/* ─────────── ساخت کارت‌ها ─────────── */
function imgTag(url, alt, cls){
  if (!url) return '';
  return '<img class="' + cls + '" src="' + esc(url) + '" alt="' + esc(alt) + '" loading="lazy" decoding="async" onerror="this.remove()">';
}

function itemCard(cat, it, withCat){
  const b = BADGE[it.badge];
  const out = it.badge === 'soldout';
  const el = document.createElement('article');
  el.className = 'card' + (out ? ' out' : '');
  el.innerHTML =
    '<div class="ph">' + cat.icon + imgTag(it.imageUrl, it.name) + '</div>' +
    '<div class="info">' +
      '<div class="nm">' + esc(it.name) +
        (b ? ' <span class="bd ' + b.cls + '">' + b.txt + '</span>' : '') +
        (withCat ? ' <span class="cat-tag">' + cat.icon + ' ' + esc(cat.name) + '</span>' : '') +
      '</div>' +
      (it.description ? '<div class="ds">' + esc(it.description) + '</div>' : '') +
      '<div class="pr">' + priceHTML(it.price) + '</div>' +
    '</div>';
  return el;
}

function specialCard(cat, it){
  const a = document.createElement('a');
  a.className = 'spec';
  a.href = '#/menu/' + cat.id;
  a.innerHTML =
    '<div class="im">' + cat.icon + imgTag(it.imageUrl, it.name) +
      (it.badge === 'new' ? '<span class="bdg">جدید</span>' : '<span class="bdg">ویژه</span>') + '</div>' +
    '<div class="tx"><div class="nm">' + esc(it.name) + '</div>' +
    '<div class="pr">' + priceHTML(it.price) + '</div></div>';
  return a;
}

/* مرتب‌سازی: موجود‌ها اول، ناموجود‌ها آخر (داخل هر دسته) */
const sortItems = arr => arr.slice().sort((a, b) =>
  (a.badge === 'soldout' ? 1 : 0) - (b.badge === 'soldout' ? 1 : 0));

/* ─────────── رندر کامل منو ─────────── */
const sectionsEl = $('#sections');

function buildSections(){
  sectionsEl.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const sec = document.createElement('section');
    sec.className = 'cat';
    sec.id = 'cat-' + cat.id;
    sec.innerHTML =
      '<div class="cat-head"><span class="ico">' + cat.icon + '</span><h2>' + esc(cat.name) +
      ' <span class="ct">' + fa(cat.items.length) + ' آیتم</span></h2><span class="rule"></span></div>' +
      '<div class="items"></div>';
    const box = sec.querySelector('.items');
    sortItems(cat.items).forEach(it => box.appendChild(itemCard(cat, it, false)));
    sectionsEl.appendChild(sec);
  });
}

function buildSpecials(){
  const list = [];
  CATEGORIES.forEach(cat => cat.items.forEach(it => {
    if (it.badge === 'special') list.push({ cat, it });
  }));
  const box = $('#specials'), strip = $('#spec-strip');
  if (!list.length) { box.hidden = true; return; }
  box.hidden = false;
  $('#spec-count').textContent = fa(list.length) + ' انتخاب از منو';
  strip.innerHTML = '';
  list.forEach(({ cat, it }) => strip.appendChild(specialCard(cat, it)));
}

function applyHero(){
  const url = CAFE.heroImage || '';
  if (!url) return;
  const css = 'url("' + url + '")';
  [$('.welcome-hero'), $('.menu-hero')].forEach(el => {
    el.classList.add('has-img');
    el.style.setProperty('--hero', css);
  });
}

/* پیل‌های وضعیت — مشترک بین صفحه‌ی خوش‌آمد و هدر منو */
function pillsHTML(){
  const pills = [];
  const st = openState();
  if (st) pills.push('<span class="pill ' + st.cls + '">' + (st.cls === 'open' ? '🟢' : '🔴') +
    ' <b>' + st.txt + '</b> ' + st.detail + '</span>');
  if (CAFE.hours) pills.push('<span class="pill">🕐 ' + esc(CAFE.hours) + '</span>');
  return pills.join('');
}

function buildMenuHeader(){
  applyHero();
  $('#m-name').textContent = CAFE.name;
  const msub = $('#m-sub');
  msub.textContent = CAFE.tagline || '';
  msub.hidden = !CAFE.tagline;
  $('#m-pills').innerHTML = pillsHTML();
}

function buildWelcome(){
  applyHero();
  $('#w-name').textContent = CAFE.name;
  const wtag = $('#w-tagline');
  wtag.textContent = CAFE.tagline || '';
  wtag.hidden = !CAFE.tagline;
  document.title = CAFE.name + ' | خوش آمدید';

  /* برچسب‌های بالا + آمار سریع کافه */
  $('#w-pills').innerHTML = pillsHTML();
  const totalItems = CATEGORIES.reduce((n, c) => n + c.items.length, 0);
  const totalSpecials = CATEGORIES.reduce((n, c) =>
    n + c.items.filter(i => i.badge === 'special').length, 0);
  $('#w-stats').innerHTML =
    '<div class="wstat"><b>' + fa(totalItems) + '</b><span>آیتم در منو</span></div>' +
    '<div class="wstat"><b>' + fa(CATEGORIES.length) + '</b><span>دسته‌بندی</span></div>' +
    (totalSpecials ? '<div class="wstat"><b>' + fa(totalSpecials) + '</b><span>پیشنهاد ویژه</span></div>' : '');

  /* شبکه‌ی دسته‌ها — با یک لمس مستقیم می‌ره سر همون دسته */
  const grid = $('#catgrid');
  grid.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const a = document.createElement('a');
    a.className = 'catcard';
    a.href = '#/menu/' + cat.id;
    a.innerHTML =
      '<div class="ic">' + cat.icon + imgTag(cat.items[0] && cat.items[0].imageUrl, cat.name) + '</div>' +
      '<div class="nm">' + esc(cat.name) + '</div>' +
      '<div class="ct">' + fa(cat.items.length) + ' آیتم</div>';
    grid.appendChild(a);
  });
}

/* ─────────── هدر چسبان: ارتفاع + اسکرول‌اسپای ─────────── */
const topbar = $('#topbar');
function measureHead(){
  const h = topbar.offsetHeight || 104;
  document.documentElement.style.setProperty('--head-h', h + 'px');
}
addEventListener('resize', measureHead);
addEventListener('load', measureHead);

function headH(){
  return (topbar && topbar.offsetHeight) || 104;
}
function scrollToCat(id, smooth){
  const sec = document.getElementById('cat-' + id);
  if (!sec) return;
  const hv = headH();
  const y = sec.getBoundingClientRect().top + scrollY - hv - 10;
  scrollTo({ top: Math.max(0, y), behavior: smooth === false ? 'auto' : 'smooth' });
}

let raf = 0;
addEventListener('scroll', () => {
  if (raf) return;
  raf = requestAnimationFrame(() => {
    raf = 0;
    $('#toTop').classList.toggle('on', scrollY > 700);
  });
}, { passive: true });

$('#toTop').addEventListener('click', () => scrollTo({ top: 0, behavior: 'smooth' }));

/* ─────────── جستجو ─────────── */
const qEl = $('#q'), resEl = $('#results'), clrEl = $('#qclr');
let searchTimer = 0;

function runSearch(raw){
  const query = norm(raw);
  resEl.innerHTML = '';
  if (!query) {
    resEl.hidden = true;
    document.body.classList.remove('searching');
    sectionsEl.hidden = false;
    $('#specials').hidden = !$('#spec-strip').children.length;
    requestAnimationFrame(measureHead);
    return;
  }
  document.body.classList.add('searching');
  sectionsEl.hidden = true;
  $('#specials').hidden = true;
  resEl.hidden = false;
  requestAnimationFrame(measureHead);

  const hits = [];
  CATEGORIES.forEach(cat => cat.items.forEach(it => {
    if (norm(it.name + ' ' + (it.description || '') + ' ' + cat.name).includes(query))
      hits.push({ cat, it });
  }));
  hits.sort((a, b) => (a.it.badge === 'soldout' ? 1 : 0) - (b.it.badge === 'soldout' ? 1 : 0));

  if (!hits.length) {
    resEl.innerHTML =
      '<div class="empty"><span class="big">🔍</span>چیزی با این اسم توی منو پیدا نشد' +
      '<br><a class="sug" href="#/menu" onclick="clearSearch()">دیدن کل منو</a></div>';
    return;
  }
  const t = document.createElement('p');
  t.className = 'res-title';
  t.innerHTML = faDigits(hits.length) + ' مورد برای «<b>' + esc(raw.trim()) + '</b>»';
  resEl.appendChild(t);
  hits.forEach(({ cat, it }) => resEl.appendChild(itemCard(cat, it, true)));
}

function clearSearch(){ qEl.value = ''; clrEl.hidden = true; runSearch(''); }

qEl.addEventListener('input', () => {
  clrEl.hidden = !qEl.value;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => runSearch(qEl.value), 110);
});
qEl.addEventListener('keydown', e => { if (e.key === 'Escape') clearSearch(); });
clrEl.addEventListener('click', clearSearch);
window.clearSearch = clearSearch;

/* ─────────── روتر ─────────── */
const views = { splash: $('#view-splash'), welcome: $('#view-welcome'), menu: $('#view-menu') };
let current = 'splash';

function show(name){
  Object.keys(views).forEach(k => { views[k].hidden = (k !== name); });
  views[name].classList.remove('anim');
  void views[name].offsetWidth;
  views[name].classList.add('anim');
  current = name;
  measureHead();
}

let splashTimer = 0;
function route(){
  const h = location.hash || '#/';
  clearTimeout(splashTimer);

  if (h.indexOf('#/menu') === 0) {
    const catId = h.split('/')[2] || '';
    document.title = 'منو | ' + CAFE.name;
    buildMenuHeader();
    show('menu');
    if (catId) {
      requestAnimationFrame(() => scrollToCat(catId, false));
    } else {
      scrollTo(0, 0);
    }
    return;
  }
  if (h === '#/welcome') {
    try { sessionStorage.setItem('retro_seen', '1'); } catch (e) {}
    buildWelcome();
    show('welcome');
    scrollTo(0, 0);
    return;
  }
  /* مسیر پیش‌فرض: اسپلش، ولی برای مشتری‌های همیشگی مستقیم خوش‌آمد */
  let target = 'splash';
  try { if (sessionStorage.getItem('retro_seen')) target = 'welcome'; } catch (e) {}
  if (target === 'welcome') { buildWelcome(); document.title = CAFE.name + ' | خوش آمدید'; }
  else document.title = CAFE.name;
  show(target);
  scrollTo(0, 0);
  if (target === 'splash') {
    splashTimer = setTimeout(() => {
      if ((location.hash || '#/') === '#/' && current === 'splash') location.hash = '#/welcome';
    }, 1800);
  }
}

$('#view-splash').addEventListener('click', () => { location.hash = '#/welcome'; });
addEventListener('hashchange', route);

/* ─────────── راه‌اندازی ─────────── */
fillFooter();
buildMenuHeader();
buildSections();
buildSpecials();
buildWelcome();
route();

/* PWA — کش آفلاین بعد از اولین بازدید */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
