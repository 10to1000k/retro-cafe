<!DOCTYPE html>
<!-- پوستر چاپی A4 — برای چاپ: صفحه را باز کن و دکمه‌ی چاپ را بزن -->
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پوستر منوی RETRO CAFE</title>
<style>
  @font-face{font-family:'Vazirmatn';src:url('fonts/Vazirmatn-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
  @font-face{font-family:'Vazirmatn';src:url('fonts/Vazirmatn-Bold.woff2') format('woff2');font-weight:700;font-display:swap}
  @font-face{font-family:'AlfaSlabOne';src:url('fonts/AlfaSlabOne-Latin.woff2') format('woff2');font-weight:400;font-display:swap}
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Vazirmatn',Tahoma,sans-serif;
    background:#3a281a;color:#2b1a10;
    display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px;
  }
  .sheet{
    width:210mm;min-height:285mm;background:#f6ecdc;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:16mm;position:relative;overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,.4);
  }
  .frame{
    position:absolute;inset:9mm;border:1.2mm solid #b98a4e;border-radius:6mm;pointer-events:none;
  }
  .frame::after{content:'';position:absolute;inset:2.5mm;border:.4mm solid #d9b98c;border-radius:4mm}
  .mark{width:34mm;height:34mm;margin-bottom:5mm}
  .mark svg{width:100%;height:100%;display:block}
  h1{font-family:'AlfaSlabOne',Georgia,serif;font-weight:400;direction:ltr;font-size:15mm;color:#2b1a10;letter-spacing:.6mm}
  .sub{font-size:6.2mm;color:#8a6a44;margin-top:3mm;font-weight:400}
  .qr{
    width:88mm;height:88mm;margin:10mm auto 6mm;padding:5mm;background:#fff;
    border:1mm solid #b98a4e;border-radius:5mm;
  }
  .qr img{width:100%;height:100%;display:block}
  .url{direction:ltr;font-size:4.2mm;color:#8a6a44;margin-bottom:9mm;word-break:break-all}
  .steps{list-style:none;font-size:5.4mm;line-height:2.1;color:#2b1a10}
  .steps b{color:#b0642a}
  .foot{margin-top:10mm;font-size:4.6mm;color:#a08055}
  .noprint{
    background:#e9b168;color:#241407;font-family:inherit;font-size:16px;font-weight:700;
    border:0;border-radius:12px;padding:13px 34px;cursor:pointer;
  }
  @media print{
    @page{size:A4 portrait;margin:0}
    body{background:#fff;padding:0}
    .sheet{box-shadow:none;width:210mm;min-height:297mm}
    .noprint{display:none}
  }
</style>
</head>
<body>
<div class="sheet">
  <div class="frame"></div>
  <div class="mark"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="60" fill="#C0301F"/>
  <circle cx="60" cy="60" r="53.5" fill="none" stroke="#FFB627" stroke-width="2.75"/>
  <circle cx="60" cy="60" r="46" fill="#FFF8EE"/>
  <g fill="#F3E4C6" opacity=".55">
    <path d="M60 60 L54.4 14.3 A46 46 0 0 1 65.6 14.3 Z"/>
    <path d="M60 60 L99.8 37 A46 46 0 0 1 105.4 48.2 Z"/>
    <path d="M60 60 L105.4 71.8 A46 46 0 0 1 99.8 83 Z"/>
    <path d="M60 60 L65.6 105.7 A46 46 0 0 1 54.4 105.7 Z"/>
    <path d="M60 60 L20.2 83 A46 46 0 0 1 14.6 71.8 Z"/>
    <path d="M60 60 L14.6 48.2 A46 46 0 0 1 20.2 37 Z"/>
  </g>
  <g stroke="#B87A16" stroke-width="3.6" fill="none" stroke-linecap="round">
    <path d="M53 41c-3.6-5.4 3.2-8.6 0-14"/>
    <path d="M66.5 41c-3.6-5.4 3.2-8.6 0-14" opacity=".72"/>
  </g>
  <path d="M80 56c12 .5 13.5 13.5 -1.5 16.5" stroke="#C0301F" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M38 51c1.2 14.5 4.8 25.5 9 29.5c4.2 3.9 21.8 3.9 26 0c4.2-4 7.8-15 9-29.5z" fill="#C0301F"/>
  <ellipse cx="60" cy="51" rx="22" ry="5.9" fill="#FFB627"/>
  <path d="M34.5 86q25.5 10.5 51 0" stroke="#FFB627" stroke-width="5" fill="none" stroke-linecap="round"/></svg></div>
  <h1>RETRO CAFE</h1>
  <div class="sub">منوی دیجیتال ما را ببینید</div>
  <div class="qr"><img src="qr.png" alt="کد QR منو"></div>
  <div class="url">10to1000k.github.io/retro-cafe</div>
  <ol class="steps">
    <li><b>۱)</b> دوربین گوشی‌ات را باز کن</li>
    <li><b>۲)</b> روی کد بگیر</li>
    <li><b>۳)</b> منو فوری بالا می‌آید ✨</li>
  </ol>
  <div class="foot">نسیم شهر، خیابان اصلی، جنب درمانگاه قائم — اینستاگرام: <span dir="ltr">@Caferetro_ir</span></div>
</div>
<button class="noprint" onclick="print()">🖨 چاپ پوستر</button>
</body>
</html>
